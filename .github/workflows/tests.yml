name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp==3.13.5 keyring==25.7.0
      - name: Run offline suite (no skipped modules)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -p no:cacheprovider -q -rs --junitxml=/tmp/tests.xml controller/tests
          python -c 'import xml.etree.ElementTree as E; assert not E.parse("/tmp/tests.xml").findall(".//skipped"), "Unexpected skipped tests"'
      - name: Shell syntax
        run: bash -n controller/install.sh controller/render_systemd_unit.sh
